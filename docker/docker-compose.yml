services:
  prism-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      network: host
      args:
        INSTALL_ROS2: "false"
        HOST_UID: 1000
        HOST_GID: 1000
    image: kirillmouraviev/prism-topomap:cuda12.1
    command: ["sleep", "infinity"]
    network_mode: host
    ipc: host
    # privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prism-dev-ros2:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      network: host
      args:
        INSTALL_ROS2: "true"
        HOST_UID: 1000
        HOST_GID: 1000
    image: kirillmouraviev/prism-topomap:cuda12.1-ros2-humble
    init: true
    command: ["sleep", "infinity"]
    network_mode: host
    ipc: host
    devices:
      - "nvidia.com/gpu=0"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - ../data:/data
      - /media:/media